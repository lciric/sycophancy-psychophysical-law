<svg xmlns="http://www.w3.org/2000/svg" width="980" height="310" viewBox="0 0 980 310" role="img" aria-label="Design of the experiment: one item, two conditions with the same seed, one judge, one displacement per item">
<title>Design of the experiment: one item, two conditions with the same seed, one judge, one displacement per item</title>
<rect width="980" height="310" fill="#ffffff"/>
<text x="490.0" y="24" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">One item, two conditions, one seed: how a displacement Δ is measured</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/></marker></defs>
<rect x="20" y="125" width="120" height="60" rx="6" fill="#f7f7f7" stroke="#444444" stroke-width="1.2"/>
<text x="80.0" y="146.0" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Item</text>
<text x="80.0" y="159.0" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">a short text</text>
<text x="80.0" y="172.0" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">to assess</text>
<line x1="140" y1="145" x2="215" y2="97" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="140" y1="165" x2="215" y2="213" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="215" y="72" width="190" height="50" rx="6" fill="#f7f7f7" stroke="#444444" stroke-width="1.2"/>
<text x="310.0" y="101.0" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Neutral prompt</text>
<rect x="215" y="188" width="190" height="62" rx="6" fill="#f7f7f7" stroke="#D55E00" stroke-width="1.2"/>
<text x="310.0" y="210.0" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Pressured prompt</text>
<text x="310.0" y="223.0" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">“I think this is terrible…”  (critical arm)</text>
<text x="310.0" y="236.0" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">“I think this is brilliant…”  (praise arm)</text>
<text x="310" y="150" font-size="9.5" fill="#444444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">the same instruction for both; the pressured prompt adds one sentence</text>
<text x="310" y="164" font-size="9.5" fill="#444444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">the same random seed for both; K = 10 seeds per item</text>
<line x1="405" y1="97" x2="465" y2="97" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="405" y1="219" x2="465" y2="219" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="465" y="72" width="160" height="50" rx="6" fill="#f7f7f7" stroke="#444444" stroke-width="1.2"/>
<text x="545.0" y="94.5" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Model</text>
<text x="545.0" y="107.5" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Llama-3.1-8B-Instruct, T = 0.3</text>
<rect x="465" y="194" width="160" height="50" rx="6" fill="#f7f7f7" stroke="#444444" stroke-width="1.2"/>
<text x="545.0" y="216.5" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Model</text>
<text x="545.0" y="229.5" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">same weights, same seed</text>
<line x1="625" y1="97" x2="700" y2="97" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="662.5" y="89.0" font-size="9.5" fill="#444444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">free-text answer</text>
<line x1="625" y1="219" x2="700" y2="219" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="662.5" y="211.0" font-size="9.5" fill="#444444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">free-text answer</text>
<rect x="700" y="72" width="130" height="50" rx="6" fill="#eef3f8" stroke="#444444" stroke-width="1.2"/>
<text x="765.0" y="94.5" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Judge</text>
<text x="765.0" y="107.5" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">reads it, scores 1–5</text>
<rect x="700" y="194" width="130" height="50" rx="6" fill="#eef3f8" stroke="#444444" stroke-width="1.2"/>
<text x="765.0" y="216.5" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Judge</text>
<text x="765.0" y="229.5" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">same prompt, same judge</text>
<line x1="830" y1="97" x2="865" y2="135" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="830" y1="219" x2="865" y2="181" stroke="#444444" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="865" y="122" width="100" height="72" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
<text x="915.0" y="142.5" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">p₀ = mean of the</text>
<text x="915.0" y="155.5" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">neutral scores</text>
<text x="915.0" y="168.5" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">p₁ = mean under</text>
<text x="915.0" y="181.5" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">pressure</text>
<text x="490.0" y="282" font-size="12" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Per item: Δ = p₁ − p₀.  The law: Δ = g · (ĉ − p₀) — one gain g, one fixed point ĉ per kind of pressure.</text>
<text x="490.0" y="299" font-size="10" fill="#444444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Criteria, seeds, judge prompt and analysis code were fixed before the data; every published result is recomputed from its public input in CI.</text>
</svg>
