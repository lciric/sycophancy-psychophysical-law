name: reproduce
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify every file against SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Install the pinned dependency
        run: python3 -m pip install -r requirements.txt
      - name: Recompute every number and compare with code/expected.json
        run: python3 -I code/reproduce.py --check
      - name: Self-test of the frozen analysis for the follow-up runs
        run: python3 -I code/analyse_runs.py --selftest
      - name: Self-test of the frozen dose-response analysis (R6)
        run: python3 -I code/analyse_dose.py --selftest
      - name: Recompute every published follow-up result from its input
        run: python3 -I code/check_results.py
      - name: Regenerate the figures from the published files and compare byte for byte
        run: python3 -I code/make_figures.py --check
